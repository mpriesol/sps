name: Tests and Docker build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: python -m pytest -q
      - run: docker build -t sps-receiver:test .
      - name: Verify password volume with the non-root container user
        run: |
          docker run --rm --read-only --tmpfs /tmp -v sps-password-test:/app/data sps-receiver:test python -c "from app.courier_passwords import CourierPasswords; s = CourierPasswords('/app/data/test.json'); s.save({'id': 1, 'code': 'TEST', 'name': 'Test'}, 'test-only')"
          docker run --rm --read-only --tmpfs /tmp -v sps-password-test:/app/data sps-receiver:test python -c "from app.courier_passwords import CourierPasswords; s = CourierPasswords('/app/data/test.json'); assert s.password(1) == 'test-only'; assert s.path.stat().st_mode & 0o777 == 0o600"
          docker volume rm sps-password-test
